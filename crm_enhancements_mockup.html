<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hockey CRM — Enhancement Mockup</title>
<style>
/* ===== Design tokens (mirror crm_hockey.html) ===== */
:root{
  --bg:#f5f5f7; --panel:#ffffff; --panel2:#fbfbfd; --ink:#1d1d1f; --ink2:#6e6e73;
  --line:#e3e3e6; --accent:#0071e3; --accent2:#0a84ff; --good:#1d9e75; --warn:#ba7517;
  --bad:#e24b4a; --r:14px; --shadow:0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);
  color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;min-height:100vh}
a{color:var(--accent);text-decoration:none}
h1,h2,h3{margin:0}

/* ===== Layout ===== */
.sidebar{width:230px;flex:0 0 230px;background:var(--panel);border-right:1px solid var(--line);
  height:100vh;position:sticky;top:0;display:flex;flex-direction:column;gap:4px;padding:16px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand b{font-size:15px}
.brand small{display:block;color:var(--ink2);font-size:11px;font-weight:500}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0071e3,#0a84ff);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.tab{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;color:var(--ink2);
  font-weight:600;font-size:13px;cursor:pointer;border:none;background:none;text-align:left;width:100%;transition:.12s}
.tab:hover{background:var(--panel2);color:var(--ink)}
.tab.active{background:rgba(0,113,227,.1);color:var(--accent)}
.tab .num{margin-left:auto;font-size:10px;color:#b5b5ba;font-weight:700}
main{flex:1;min-width:0;padding:26px clamp(14px,3vw,34px)}

/* ===== Primitives ===== */
.sec-title{display:flex;align-items:flex-start;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.sec-title .badge{width:40px;height:40px;flex:0 0 40px;border-radius:11px;
  background:linear-gradient(135deg,#0071e3,#0a84ff);color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:15px;box-shadow:0 4px 12px rgba(0,113,227,.3)}
.sec-title h1{font-size:22px;font-weight:700;letter-spacing:-.4px}
.sec-title p{color:var(--ink2);font-size:13px;margin-top:2px}
.sec-title .actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-size:21px;font-weight:800;line-height:1.1}
.kpi .l{color:var(--ink2);font-size:12px;font-weight:500;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;transition:.12s}
.btn:hover{border-color:#c9c9cf;background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#005ec4}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--bad);border-color:#f3c9c9}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;
  font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--ink2)}
.pill.accent{color:var(--accent);background:rgba(0,113,227,.1);border-color:transparent}
.pill.good{color:var(--good);background:rgba(29,158,117,.12);border-color:transparent}
.pill.warn{color:var(--warn);background:rgba(186,117,23,.12);border-color:transparent}
.muted{color:var(--ink2)}
.empty{text-align:center;color:var(--ink2);padding:34px 20px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--ink2);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
td.num,th.num{text-align:right}
input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
label.fld{display:block;font-size:12px;color:var(--ink2);font-weight:700;margin-bottom:5px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:none;background:none;padding:6px 14px;border-radius:7px;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer}
.seg button.active{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ===== Profile cards ===== */
.pcard{cursor:pointer;display:flex;flex-direction:column;gap:12px;position:relative}
.pcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pcard .top{display:flex;gap:12px;align-items:center}
.pcard .num{width:46px;height:46px;flex:0 0 46px;border-radius:12px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.pcard .kpis{display:flex;gap:8px}
.pcard .mini{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 8px;text-align:center}
.pcard .mini b{font-size:15px}
.pcard .mini span{display:block;font-size:10px;color:var(--ink2);font-weight:600}
.cdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 10px}

/* ===== Tabs (profile modal) ===== */
.tabsrow{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin:4px 0 16px;scrollbar-width:thin}
.tabsrow button{padding:9px 14px;border:none;background:none;color:var(--ink2);font-weight:700;font-size:13px;
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;cursor:pointer}
.tabsrow button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.evrow{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:13px}
.evrow .lbl{flex:1;color:var(--ink2)}
.bar{flex:0 0 120px;height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:4px}
.evrow .vv{width:28px;text-align:right;font-weight:700}
dl.bio{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0}
dl.bio dt{font-size:11px;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
dl.bio dd{margin:2px 0 0;font-weight:600}

/* ===== Lineup board (Estimated Composition + edit) ===== */
.rline{display:flex;gap:8px;margin-bottom:8px}
.rslot{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 9px;background:var(--panel);
  cursor:pointer;position:relative;min-height:56px;display:flex;flex-direction:column;gap:3px}
.rslot .pos{font-size:10px;font-weight:800;color:var(--ink2);text-transform:uppercase}
.rslot .pl{font-weight:700;font-size:13px}
.rslot.filled{border-color:var(--accent);background:rgba(0,113,227,.05)}
.rslot.eligible{border-style:dashed;border-color:var(--accent);background:rgba(0,113,227,.07)}
.rslot.dragover{border-color:var(--accent);background:rgba(0,113,227,.14)}
.rslot .x{position:absolute;top:4px;right:6px;border:none;background:none;color:var(--ink2);cursor:pointer;font-size:15px;line-height:1}
.poolzone{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;min-height:38px;padding:4px;border-radius:9px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;
  background:var(--panel);cursor:grab;font-size:12px;font-weight:700}
.pchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pchip.sel{border-color:var(--accent);background:rgba(0,113,227,.1);color:var(--accent)}

/* ===== Ice / Match-Day presentation ===== */
.ice{background:linear-gradient(180deg,#f0f7ff,#e8f1fb);border:1px solid #d3e3f5;border-radius:14px;padding:16px}
.ice .hd{font-size:11px;font-weight:800;color:var(--ink2);letter-spacing:.4px;margin:10px 0 6px}
.ice .hd:first-child{margin-top:0}
.slot{background:var(--panel);border:1px dashed #b9cfe6;border-radius:10px;padding:8px;min-height:54px;
  text-align:center;font-size:12px;flex:1}
.slot.filled{border-style:solid;border-color:var(--accent);background:#fff}
.slot .pos{font-size:10px;color:var(--ink2);font-weight:800;text-transform:uppercase}
.slot .nm{font-weight:700;font-size:13px;margin-top:3px}
.gkrow{display:flex;gap:8px;flex-wrap:wrap}

/* ===== Modal ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;
  padding:28px 16px;z-index:1000;overflow:auto}
.modal.open{display:flex}
.modal .box{background:var(--panel);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.3);width:100%;max-width:840px}
.modal .head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--panel);border-radius:18px 18px 0 0;z-index:2}
.modal .head h2{font-size:17px}
.modal .head .x{margin-left:auto;width:32px;height:32px;border-radius:9px;border:none;background:var(--panel2);
  font-size:18px;color:var(--ink2);cursor:pointer}
.modal .body{padding:20px}
.banner{background:#fff8e6;border:1px solid #f0e0a8;color:#7a5e12;border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:18px}

/* ===== Responsive ===== */
@media (max-width:760px){
  body{flex-direction:column}
  .sidebar{width:auto;flex:none;height:auto;position:sticky;top:0;flex-direction:row;align-items:center;
    overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);z-index:5}
  .brand{padding:6px 8px;flex:0 0 auto}
  .tab{width:auto;flex:0 0 auto}
  .tab .num{display:none}
  main{padding:18px 14px}
}
</style>
</head>

<script>
"use strict";
/* ============================================================ helpers */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function parseLocalDate(s){if(!s)return null;const m=String(s).split('-').map(Number);if(m.length<3||!m[0])return null;return new Date(m[0],m[1]-1,m[2]);}
function fmtDate(s){const d=parseLocalDate(s);if(!d)return '—';return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'short',year:'numeric'});}
function ageFromDob(dob){const d=parseLocalDate(dob);if(!d)return null;const t=new Date();let a=t.getFullYear()-d.getFullYear();const m=t.getMonth()-d.getMonth();if(m<0||(m===0&&t.getDate()<d.getDate()))a--;return a;}
function monthsUntil(s){const d=parseLocalDate(s);if(!d)return null;return (d-new Date())/(1000*60*60*24*30.44);}
/* contract-expiry color gradation — analogous to the Scout block grade tiers */
function contractTier(exp){const m=monthsUntil(exp);
  if(m==null)return{key:'none',color:'#c9c9cf',label:'Без даты'};
  if(m<0)    return{key:'expired',color:'#7a1f1f',label:'Истёк'};
  if(m<=3)   return{key:'urgent',color:'#e24b4a',label:'< 3 мес'};
  if(m<=12)  return{key:'soon',color:'#ba7517',label:'< 1 года'};
  if(m<=24)  return{key:'mid',color:'#0071e3',label:'1–2 года'};
  return           {key:'long',color:'#1d9e75',label:'> 2 лет'};}
function hex2rgba(h,a){const n=parseInt(h.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}
function evColor(v){if(v>=4)return '#1d9e75';if(v>=3)return '#0071e3';if(v>=2)return '#ba7517';return '#e24b4a';}
function avg(a){a=a.filter(x=>typeof x==='number');return a.length?a.reduce((s,x)=>s+x,0)/a.length:0;}
function round1(n){return Math.round(n*10)/10;}
function surname(p){return (p.name||'').split(' ')[0];}

const POS_FULL={C:'Центр',LW:'Лев. нап.',RW:'Прав. нап.',D:'Защитник',G:'Вратарь'};
const POS_LABEL={C:'C',LW:'LW',RW:'RW',D:'D',G:'G'};
function posGroup(p){return p==='G'?'G':(p==='D'?'D':'F');}
const AXES={F:['Катание','Бросок','IQ','Борьба','Атака'],D:['Катание','Оборона','IQ','Первый пас','Игра в теле'],G:['Реакция','Позиция','Отскоки','Психика','Игра клюшкой']};
const GRADE_TIERS=[
  {key:'green',color:'#22c55e',label:'Зелёный',meaning:'ТОП-5 / ключевое звено'},
  {key:'purple',color:'#8b5cf6',label:'Фиолетовый',meaning:'Игроки 5–10 состава'},
  {key:'red',color:'#ef4444',label:'Красный',meaning:'Скорость / габариты'},
  {key:'yellow',color:'#eab308',label:'Жёлтый',meaning:'Ролевой / меньшинство'},
  {key:'white',color:'#e5e7eb',label:'Белый',meaning:'Глубина состава'}];
function gradeTier(k){return GRADE_TIERS.find(t=>t.key===k)||null;}
function gradeChip(k){const t=gradeTier(k);return t?`<span class="pill" style="border-color:transparent;background:${hex2rgba(t.color,.16)};color:${t.color}"><span class="cdot" style="background:${t.color}"></span>${t.label}</span>`:'';}

/* compact dependency-free radar (replaces Chart.js in the mockup) */
function radarSVG(group,vals){const axes=AXES[group]||AXES.F,N=axes.length,cx=110,cy=104,R=74,max=5;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let grid='';for(let g=1;g<=4;g++){const pts=axes.map((_,i)=>pt(i,R*g/4).join(',')).join(' ');grid+=`<polygon points="${pts}" fill="none" stroke="#e3e3e6"/>`;}
  let spokes='',labels='';axes.forEach((a,i)=>{const e=pt(i,R);spokes+=`<line x1="${cx}" y1="${cy}" x2="${e[0]}" y2="${e[1]}" stroke="#e3e3e6"/>`;const l=pt(i,R+15);labels+=`<text x="${l[0]}" y="${l[1]}" font-size="9" fill="#6e6e73" text-anchor="middle" dominant-baseline="middle">${esc(a)}</text>`;});
  const poly=vals.map((v,i)=>pt(i,R*Math.max(0,Math.min(max,v))/max).join(',')).join(' ');
  return `<svg viewBox="0 0 220 208" width="100%" style="max-width:250px;display:block;margin:auto" role="img" aria-label="Радар оценки">${grid}${spokes}<polygon points="${poly}" fill="rgba(0,113,227,.16)" stroke="#0071e3" stroke-width="2"/>${labels}</svg>`;}

/* ============================================================ lineup board (shared) */
const SLOTS={
  fwd:[1,2,3,4],fwdPos:['L','C','R'],def:[1,2,3,4],defPos:['L','R'],gk:['g1','g2','g3'],
  fKeys(){const a=[];this.fwd.forEach(n=>this.fwdPos.forEach(p=>a.push('f'+n+p)));return a;},
  dKeys(){const a=[];this.def.forEach(n=>this.defPos.forEach(p=>a.push('d'+n+p)));return a;},
  label(k){if(k[0]==='g')return 'Вратарь '+k[1];const ln=k[1],ps=k[2];
    const fp={L:'ЛН',C:'Ц',R:'ПН'},dp={L:'ЛЗ',R:'ПЗ'};
    return (k[0]==='f'?'Звено '+ln+' · ':'Пара '+ln+' · ')+((k[0]==='f'?fp:dp)[ps]||ps);}
};
function Board(opts){return{
  key:opts.key,place:opts.place||{},sel:null,drag:null,getEntities:opts.getEntities,getMeta:opts.getMeta||(()=>''),
  byId(id){return this.getEntities().find(e=>e.id===id)||null;},
  eligible(slot,id){const e=this.byId(id);if(!e)return false;if(slot[0]==='g')return e.pos==='G';if(slot[0]==='d')return e.pos==='D';return e.pos!=='G';},
  assign(slot,id){if(id){for(const k in this.place){if(this.place[k]===id&&k!==slot)delete this.place[k];}this.place[slot]=id;}else{delete this.place[slot];}this.sel=null;this.render();},
  slotClick(slot){const cur=this.place[slot];if(this.sel){if(this.sel===cur){this.sel=null;this.render();return;}if(this.eligible(slot,this.sel)){this.assign(slot,this.sel);}else{toast('Игрок не подходит на эту позицию');}return;}if(cur){this.sel=cur;this.render();}},
  poolClick(id){this.sel=(this.sel===id?null:id);this.render();},
  dragStart(e,id){this.drag=id;try{e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';}catch(_){}},
  slotDrop(e,slot){e.preventDefault();const id=this.drag;this.drag=null;e.currentTarget.classList.remove('dragover');if(!id)return;if(!this.eligible(slot,id)){toast('Игрок не подходит на эту позицию');return;}this.assign(slot,id);},
  poolDrop(e){e.preventDefault();const id=this.drag;this.drag=null;if(!id)return;for(const k in this.place){if(this.place[k]===id)delete this.place[k];}this.render();},
  slotHtml(slot){const id=this.place[slot];const p=id?this.byId(id):null;const elig=this.sel&&!id&&this.eligible(slot,this.sel);const picked=this.sel&&id===this.sel;
    return `<div class="rslot${p?' filled':''}${elig?' eligible':''}${picked?' picked':''}" role="button" tabindex="0" aria-label="${esc(SLOTS.label(slot))}"
      ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')"
      ondrop="APP.boards.${this.key}.slotDrop(event,'${slot}')" onclick="APP.boards.${this.key}.slotClick('${slot}')"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();APP.boards.${this.key}.slotClick('${slot}')}"
      ${p?`draggable="true" ondragstart="APP.boards.${this.key}.dragStart(event,'${id}')"`:''}>
      <span class="pos">${esc(SLOTS.label(slot))}</span>
      ${p?`<span class="pl">${esc(surname(p))} <span class="muted" style="font-weight:600">${POS_LABEL[p.pos]||''}</span></span>
        <button class="x" aria-label="Убрать" onclick="event.stopPropagation();APP.boards.${this.key}.assign('${slot}','')">&times;</button>`
        :`<span class="pl muted">—</span>`}</div>`;},
  poolGroup(title,filt){const used=Object.values(this.place);const list=this.getEntities().filter(e=>filt(e)&&used.indexOf(e.id)<0).sort((a,b)=>overall(b)-overall(a));
    return `<div style="margin-bottom:8px"><div class="muted" style="font-size:11px;font-weight:800;margin-bottom:2px">${title}</div>
      <div class="poolzone" ondragover="event.preventDefault()" ondrop="APP.boards.${this.key}.poolDrop(event)">
      ${list.length?list.map(e=>`<span class="pchip${this.sel===e.id?' sel':''}" draggable="true" role="button" tabindex="0"
        ondragstart="APP.boards.${this.key}.dragStart(event,'${e.id}')" onclick="APP.boards.${this.key}.poolClick('${e.id}')"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();APP.boards.${this.key}.poolClick('${e.id}')}">
        ${this.getMeta(e)}${esc(surname(e))} <span class="muted">${POS_LABEL[e.pos]||''} · ${overall(e)}</span></span>`).join(''):'<span class="muted" style="font-size:12px">— все размещены —</span>'}</div></div>`;},
  render(){const host=document.getElementById('board_'+this.key);if(!host)return;
    const fwd=`<div class="card"><b>Нападение</b><div style="margin-top:10px">${SLOTS.fwd.map(n=>`<div class="rline">${SLOTS.fwdPos.map(ps=>this.slotHtml('f'+n+ps)).join('')}</div>`).join('')}</div></div>`;
    const def=`<div class="card"><b>Защита и вратари</b><div style="margin-top:10px">${SLOTS.def.map(n=>`<div class="rline">${SLOTS.defPos.map(ps=>this.slotHtml('d'+n+ps)).join('')}</div>`).join('')}
      <div class="rline">${SLOTS.gk.map(g=>this.slotHtml(g)).join('')}</div></div></div>`;
    const pool=`<div class="card" style="margin-top:14px"><b>Доступные ${this.key==='scout'?'кандидаты':'игроки'}</b>
      <span class="muted" style="font-size:12px"> — перетащите на позицию или кликните, затем выберите ячейку</span>
      ${this.poolGroup('Нападающие',e=>e.pos!=='G'&&e.pos!=='D')}${this.poolGroup('Защитники',e=>e.pos==='D')}${this.poolGroup('Вратари',e=>e.pos==='G')}</div>`;
    host.innerHTML=`<div class="grid g2">${fwd}${def}</div>${pool}`;}
};}

/* read-only Match-Day presentation */
function iceHtml(place,resolve){
  const rowF=n=>{const ks=['f'+n+'L','f'+n+'C','f'+n+'R'];if(!ks.some(k=>place[k]))return '';return `<div class="rline">${ks.map(k=>{const p=place[k]?resolve(place[k]):null;return `<div class="slot ${p?'filled':''}"><div class="pos">${esc(SLOTS.label(k))}</div><div class="nm">${p?esc(surname(p)):'—'}</div></div>`;}).join('')}</div>`;};
  const rowD=n=>{const ks=['d'+n+'L','d'+n+'R'];if(!ks.some(k=>place[k]))return '';return `<div class="rline">${ks.map(k=>{const p=place[k]?resolve(place[k]):null;return `<div class="slot ${p?'filled':''}"><div class="pos">${esc(SLOTS.label(k))}</div><div class="nm">${p?esc(surname(p)):'—'}</div></div>`;}).join('')}</div>`;};
  const gk=SLOTS.gk.map(g=>{const p=place[g]?resolve(place[g]):null;return p?`<span class="pill accent">${esc(surname(p))}</span>`:'';}).filter(Boolean).join(' ');
  return `<div class="ice"><div class="hd">Нападение</div>${[1,2,3,4].map(rowF).join('')}
    <div class="hd">Защита</div>${[1,2,3,4].map(rowD).join('')}
    ${gk?`<div class="hd">Вратари</div><div class="gkrow">${gk}</div>`:''}</div>`;
}

      <div class="seg" style="margin-bottom:14px" role="tablist">
        <button>Кандидаты</button><button>Градация</button><button>Приоритеты</button><button>Сравнение</button>
        <button class="active" aria-current="true">Предполагаемый состав</button></div>
      <div class="banner"><b>Блок 3.</b> Новая вкладка «Предполагаемый состав»: назначайте кандидатов на позиции формации.
        Данные хранятся отдельно (<code>scoutLineup</code>) и не затрагивают реальный состав команды.
        <i>Референс-скриншот не был предоставлен — макет повторяет существующую доску состава.</i></div>
      <div id="board_scout"></div>`;
    this.boards.scout.render();
  },

  /* ---------- Block 4: Composition (Match-Day layout) ---------- */
  renderComposition(el){
    const v=this.compView;
    el.innerHTML=`<header class="sec-title"><div class="badge">04</div>
        <div><h1>Состав</h1><p>Презентация в стиле вкладки «Матч-день» · сортировка по позициям</p></div>
        <div class="actions"><div class="seg" role="tablist">
          <button class="${v==='day'?'active':''}" onclick="APP.setComp('day')">Матч-день</button>
          <button class="${v==='edit'?'active':''}" onclick="APP.setComp('edit')">Редактировать</button>
        </div></div></header>
      <div class="banner"><b>Блок 4.</b> Отображение состава повторяет дизайн вкладки «Матч-день» (площадка <code>.ice</code>:
        Нападение → Защита → Вратари). «Редактировать» открывает интерактивную доску.</div>`;
    if(v==='day'){
      const box=document.createElement('div');box.className='grid g2';
      box.innerHTML=`<div class="card"><b>Состав в день матча</b><p class="muted" style="font-size:12px;margin:4px 0 0">Только просмотр · отсортировано по ролям</p>
          ${iceHtml(this.boards.team.place,teamById)}</div>
        <div class="card"><b>Сводка</b>
          <div class="grid g2" style="margin-top:10px">
            <div class="kpi"><div class="v">${Object.keys(this.boards.team.place).filter(k=>k[0]==='f').length}</div><div class="l">Нападающие</div></div>
            <div class="kpi"><div class="v">${Object.keys(this.boards.team.place).filter(k=>k[0]==='d').length}</div><div class="l">Защитники</div></div>
            <div class="kpi"><div class="v">${Object.keys(this.boards.team.place).filter(k=>k[0]==='g').length}</div><div class="l">Вратари</div></div>
            <div class="kpi"><div class="v">${Object.keys(this.boards.team.place).length}</div><div class="l">Всего в составе</div></div>
          </div></div>`;
      el.appendChild(box);
    } else {
      const host=document.createElement('div');host.id='board_team';el.appendChild(host);this.boards.team.render();
    }
  },
  setComp(v){this.compView=v;this.render();},

  /* ---------- modal infra ---------- */
  modal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;
    const m=document.getElementById('modal');m.classList.add('open');const box=m.querySelector('.box');if(box){box.setAttribute('tabindex','-1');box.focus();}},
  closeModal(){document.getElementById('modal').classList.remove('open');}
};
function toast(msg){const t=document.createElement('div');t.textContent=msg;
  t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 18px;border-radius:11px;font-size:13px;font-weight:600;z-index:3000;box-shadow:0 8px 24px rgba(0,0,0,.25)';
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

/* close modal on backdrop click + Esc */
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')APP.closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')APP.closeModal();});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>APP.go(b.dataset.route)));
window.APP=APP; /* expose for inline handlers */
APP.go('profiles');
</script>
</body>
</html>
