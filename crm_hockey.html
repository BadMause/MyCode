      <div style="display:flex;align-items:center;gap:8px"><b>${esc(n.title||'Без названия')}</b>${n.tag?`<span class="pill accent" style="margin-left:auto">${esc(n.tag)}</span>`:''}</div>
      <p class="muted" style="margin-top:8px;font-size:13px;white-space:pre-wrap">${esc((n.body||'').slice(0,160))}</p>
      <div class="muted" style="font-size:11px;margin-top:8px">${fmtDate(n.date)}</div></div>`).join(''):'<div class="empty card" style="grid-column:1/-1">Заметок нет.</div>'}</div>`;
  },
  edit(id){
    const n=id?(CRM.store.get('notes')||[]).find(x=>x.id===id):{};
    CRM.modal.open(CRM.modal.frame(id?'Заметка':'Новая заметка',`
      <div class="row"><div style="flex:2"><label class="fld">Заголовок</label><input id="nt_title" value="${esc(n&&n.title||'')}"></div>
      <div style="flex:1"><label class="fld">Тег</label><input id="nt_tag" value="${esc(n&&n.tag||'')}"></div></div>
      <div style="margin-top:10px"><label class="fld">Текст</label><textarea id="nt_body" rows="8">${esc(n&&n.body||'')}</textarea></div>
      <div class="row" style="margin-top:14px"><button class="btn primary" onclick="CRM.modules.notes.save('${id||''}')">Сохранить</button>${id?`<button class="btn danger" onclick="CRM.modules.notes.del('${id}')">Удалить</button>`:''}<button class="btn" onclick="CRM.modal.close()">Отмена</button></div>`));
  },
  save(id){
    const notes=CRM.store.get('notes')||[];
    const data={title:document.getElementById('nt_title').value.trim(),tag:document.getElementById('nt_tag').value.trim(),body:document.getElementById('nt_body').value};
    let n=id?notes.find(x=>x.id===id):null;
    if(n){Object.assign(n,data);} else {n=Object.assign({id:uuid(),date:localYmd()},data);notes.push(n);}
    CRM.store.set('notes',notes); CRM.modal.close(); CRM.router.render(); CRM.toast('Сохранено');
  },
  del(id){ if(!confirm('Удалить заметку?'))return; CRM.store.set('notes',(CRM.store.get('notes')||[]).filter(n=>n.id!==id)); CRM.modal.close(); CRM.router.render(); }
};

/* ===================================================================
   15 — SETTINGS
   =================================================================== */
CRM.modules.settings={
  render(el){
    const s=CRM.store.get('settings')||{};
    const norms=s.norms||[];
    el.innerHTML=sectionTitle('15','Настройки','Команда, нормативы и данные')+
    `<div class="card" style="margin-bottom:14px"><b>Команда</b>
      <div class="row" style="margin-top:10px"><div style="flex:1"><label class="fld">Тренер</label><input id="st_coach" value="${esc(s.coach||'')}"></div>
      <div style="flex:1"><label class="fld">Команда</label><input id="st_team" value="${esc(s.team||'')}"></div></div>
      <div class="row" style="margin-top:10px"><div style="flex:1"><label class="fld">Лига</label><input id="st_league" value="${esc(s.league||'')}"></div>
      <div style="flex:1"><label class="fld">Сезон</label><input id="st_season" value="${esc(s.season||'')}"></div></div>
      <button class="btn primary sm" style="margin-top:10px" onclick="CRM.modules.settings.saveTeam()">Сохранить</button>
    </div>
    <div class="card" style="margin-bottom:14px"><div style="display:flex;align-items:center"><b>Нормативы физподготовки</b><button class="btn sm" style="margin-left:auto" onclick="CRM.modules.settings.editNorm()">+ Норматив</button></div>
      <table style="margin-top:8px"><thead><tr><th>Показатель</th><th>Меньше=лучше</th><th class="num">🥇</th><th class="num">🥈</th><th class="num">🥉</th><th></th></tr></thead><tbody>
      ${norms.map(n=>`<tr><td>${esc(n.name)}</td><td>${n.lower?'да':'нет'}</td><td class="num">${n.gold}</td><td class="num">${n.silver}</td><td class="num">${n.bronze}</td><td><button class="btn sm ghost" onclick="CRM.modules.settings.editNorm('${n.id}')">✎</button><button class="btn sm ghost danger" onclick="CRM.modules.settings.delNorm('${n.id}')">×</button></td></tr>`).join('')}
      </tbody></table></div>
    <div class="card"><b>Данные</b><p class="muted" style="font-size:12px;margin:6px 0">Резервное копирование и восстановление (localStorage: ${CRM.LSKEY}).</p>
      <div class="row" style="margin-top:8px;gap:8px">
        <button class="btn" onclick="CRM.modules.settings.exportFile()">⬇ Экспорт JSON</button>
        <button class="btn" onclick="document.getElementById('st_import').click()">⬆ Импорт JSON</button>
        <button class="btn danger" onclick="CRM.modules.settings.reset()">Сбросить всё</button>
        <input type="file" id="st_import" accept="application/json" style="display:none" onchange="CRM.modules.settings.importFile(this)">
      </div></div>`;
  },
  saveTeam(){
    const s=CRM.store.get('settings')||{};
    s.coach=document.getElementById('st_coach').value.trim(); s.team=document.getElementById('st_team').value.trim();
    s.league=document.getElementById('st_league').value.trim(); s.season=document.getElementById('st_season').value.trim();
    CRM.store.set('settings',s);
    const sub=document.getElementById('brandSub'); if(sub)sub.textContent=(s.team||'Команда')+' · '+(s.season||'');
    CRM.toast('Настройки сохранены');
  },
  editNorm(id){
    const norms=CRM.store.get('settings.norms')||[]; const n=id?norms.find(x=>x.id===id):{};
    CRM.modal.open(CRM.modal.frame(id?'Норматив':'Новый норматив',`
      <div><label class="fld">Название</label><input id="nm_name" value="${esc(n&&n.name||'')}"></div>
      <label class="fld" style="margin-top:10px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="nm_lower" style="width:auto" ${n&&n.lower?'checked':''}> Меньше = лучше (время)</label>
      <div class="row" style="margin-top:10px"><div style="flex:1"><label class="fld">Золото</label><input id="nm_gold" type="number" step="0.01" value="${n&&n.gold!=null?n.gold:''}"></div>
      <div style="flex:1"><label class="fld">Серебро</label><input id="nm_silver" type="number" step="0.01" value="${n&&n.silver!=null?n.silver:''}"></div>
      <div style="flex:1"><label class="fld">Бронза</label><input id="nm_bronze" type="number" step="0.01" value="${n&&n.bronze!=null?n.bronze:''}"></div></div>
      <div class="row" style="margin-top:14px"><button class="btn primary" onclick="CRM.modules.settings.saveNorm('${id||''}')">Сохранить</button><button class="btn" onclick="CRM.modal.close()">Отмена</button></div>`));
  },
  saveNorm(id){
    const norms=CRM.store.get('settings.norms')||[];
    const data={name:document.getElementById('nm_name').value.trim(),lower:document.getElementById('nm_lower').checked,gold:num(document.getElementById('nm_gold').value),silver:num(document.getElementById('nm_silver').value),bronze:num(document.getElementById('nm_bronze').value)};
    if(!data.name){CRM.toast('Укажите название');return;}
    let n=id?norms.find(x=>x.id===id):null;
    if(n)Object.assign(n,data); else {n=Object.assign({id:'norm_'+uuid().slice(3)},data);norms.push(n);}
    CRM.store.set('settings.norms',norms); CRM.modal.close(); CRM.router.render(); CRM.toast('Сохранено');
  },
  delNorm(id){ if(!confirm('Удалить норматив?'))return; CRM.store.set('settings.norms',(CRM.store.get('settings.norms')||[]).filter(n=>n.id!==id)); CRM.router.render(); },
  exportFile(){
    const blob=new Blob([CRM.store.exportJson()],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='crm_hockey_'+localYmd()+'.json'; a.click(); URL.revokeObjectURL(a.href);
    CRM.toast('Экспортировано');
  },
  importFile(inp){
    const f=inp.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=()=>{ try{ CRM.store.importJson(r.result); CRM.toast('Импортировано'); CRM.boot(); }catch(e){ CRM.toast('Ошибка импорта: '+e.message); } }; r.readAsText(f);
  },
  reset(){ if(!confirm('Удалить ВСЕ данные? Действие необратимо.'))return; if(!confirm('Точно? Рекомендуется сначала сделать экспорт.'))return; CRM.store.resetAll(); CRM.boot(); CRM.toast('Данные сброшены'); }
};

/* --------------------------- MODAL NAV MONKEY-PATCH --------------------------- */
(function(){
  const wrap=CRM.modalNav.wrap;
  ['profiles.open','matches.open','matches.matchDay','matches.matchReport','opponents.open','roster.openHistory'].forEach(path=>{
    const [mod,fn]=path.split('.');
    if(CRM.modules[mod]&&typeof CRM.modules[mod][fn]==='function'){
      CRM.modules[mod][fn]=wrap(CRM.modules[mod][fn].bind(CRM.modules[mod]));
    }
  });
})();

/* === MODULES ANCHOR === */

window.addEventListener('DOMContentLoaded',CRM.boot);
</script>
</body>
